name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Package Release
        run: |
          ./scripts/package-release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true

  update-homebrew-tap:
    runs-on: ubuntu-latest
    needs: build-and-release
    env:
      HOMEBREW_TAP_PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}

    steps:
      - name: Skip when tap token is unavailable
        if: ${{ env.HOMEBREW_TAP_PUSH_TOKEN == '' }}
        run: echo "HOMEBREW_TAP_PUSH_TOKEN is not configured; skipping tap update."

      - name: Checkout tool repository
        if: ${{ env.HOMEBREW_TAP_PUSH_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout homebrew tap
        if: ${{ env.HOMEBREW_TAP_PUSH_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: life2you/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
          path: homebrew-tap

      - name: Generate updated cask
        if: ${{ env.HOMEBREW_TAP_PUSH_TOKEN != '' }}
        run: |
          version="${RELEASE_TAG#v}"
          ./scripts/update-homebrew-cask.sh "$version" --output "homebrew-tap/Casks/agentfloat.rb"

      - name: Commit and push tap update
        if: ${{ env.HOMEBREW_TAP_PUSH_TOKEN != '' }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Casks
          git add Casks/agentfloat.rb
          if git diff --cached --quiet; then
            echo "No tap update needed."
            exit 0
          fi
          git commit -m "Update agentfloat to ${RELEASE_TAG#v}"
          git push origin HEAD:main
